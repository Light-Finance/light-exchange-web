name: FTP inspect (diagnostic)

# One-off helper: use basic-ftp (same lib the deploy uses, so passive mode works)
# to map the server and find where index.html files live. Read-only.
on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Map FTP tree
        timeout-minutes: 3
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          npm i basic-ftp@5 >/dev/null 2>&1
          cat > inspect.mjs <<'JS'
          import { Client } from 'basic-ftp';
          const c = new Client(30000);
          c.ftp.verbose = false;
          try {
            await c.access({
              host: process.env.FTP_SERVER,
              user: process.env.FTP_USERNAME,
              password: process.env.FTP_PASSWORD,
              secure: true,
              secureOptions: { rejectUnauthorized: false },
            });
            const root = await c.pwd();
            console.log('LANDING PWD =', root);
            async function walk(dir, depth) {
              if (depth < 0) return;
              let list;
              try { list = await c.list(dir); } catch (e) { console.log('  (cannot list', dir, ')'); return; }
              for (const f of list) {
                const p = dir.replace(/\/$/, '') + '/' + f.name;
                if (f.isDirectory) {
                  console.log('DIR ', p);
                  // only descend into likely web roots to stay fast
                  if (/^(public_html|www|htdocs|httpdocs|lightexchange|domains|assets)/i.test(f.name) || depth >= 2) {
                    await walk(p, depth - 1);
                  }
                } else if (/^index\.html$/i.test(f.name) || /^index-.*\.(js|css)$/i.test(f.name)) {
                  console.log('FILE', p, f.size, 'bytes', f.modifiedAt || '');
                }
              }
            }
            await walk(root, 3);
          } catch (e) {
            console.log('ERROR', e.message);
          } finally {
            c.close();
          }
          JS
          node inspect.mjs
