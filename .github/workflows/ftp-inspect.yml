name: FTP inspect (diagnostic)

# One-off helper: connect with the saved FTP secrets and print the directory
# layout so we can find the real docroot for lightexchange.io. Safe — it only
# lists directories and greps index.html, never writes. Delete after use.
on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: List FTP tree and locate index.html
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          echo "Configured FTP_SERVER_DIR secret = [${FTP_SERVER_DIR}]"
          echo "----- ftps, explicit, port 21 -----"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" \
               -e "set ssl:verify-certificate no; set ftp:ssl-protect-data true; \
                   echo '== pwd =='; pwd; \
                   echo '== ls landing dir =='; ls; \
                   echo '== find index.html (3 levels) =='; \
                   find -d 3 | grep -i 'index.html' || true; \
                   echo '== ls public_html if present =='; (cd public_html && pwd && ls) || echo 'no public_html here'; \
                   bye" \
               "ftps://$FTP_SERVER" || echo "ftps failed"
