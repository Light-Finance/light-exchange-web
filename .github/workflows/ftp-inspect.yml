name: FTP inspect (diagnostic)

# One-off helper: connect with the saved FTP secrets and print the landing
# directory + a shallow listing so we can find the real docroot. Read-only.
on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Show FTP landing dir and shallow listing
        timeout-minutes: 2
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          echo "Configured FTP_SERVER_DIR secret = [${FTP_SERVER_DIR}]"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftps://$FTP_SERVER" <<'EOF'
          set ssl:verify-certificate no
          set net:timeout 15
          set net:max-retries 2
          set net:reconnect-interval-base 3
          echo === PWD (where the login lands) ===
          pwd
          echo === LS landing dir ===
          ls
          echo === LS public_html ===
          cls -l public_html || echo "(no public_html in landing dir)"
          echo === LS the configured deploy dir ===
          cls -l "$FTP_SERVER_DIR" || echo "(configured dir not found)"
          bye
          EOF
